[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "bose-polaron-gpe"
dynamic = ["version"]
description = "C++-backed Python solvers for quenched and driven 1D Bose polarons"
readme = "docs/PYTHON.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Saptarshi Majumdar" }]
dependencies = ["numpy>=1.23"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/saptarshi7889/Conservative-Finite-Difference-Method-for-GPE-of-1d-Bose-Polaron"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/bose_polaron_gpe"]
install.components = ["Python"]
sdist.include = ["/pyproject.toml", "/CMakeLists.txt", "/Makefile", "/cmake/**", "/src/**", "/include/**", "/python/**", "/tests/**", "/legacy/**", "/README.md", "/docs/PYTHON.md", "/docs/USAGE.md", "/examples/python/**", "/environment-python.yml", "/LICENSE"]
sdist.exclude = ["docs/media/**", "examples/*animation*/**", "examples/F4/**", "examples/G05_F05_L8500/**"]

[tool.scikit-build.cmake.define]
GPE_BUILD_PYTHON = "ON"
GPE_BUILD_CLI = "OFF"
BUILD_TESTING = "OFF"
BUILD_SHARED_LIBS = "OFF"

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(bose_polaron_gpe VERSION (?P<value>[0-9.]+)'
