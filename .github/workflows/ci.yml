name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conda:
    name: Conda environment
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: bose-polaron-gpe
          auto-activate-base: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test functions and simulations
        run: ctest --test-dir build --output-on-failure
      - name: Test installed library consumer
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/gpe-install"
          cmake -S examples/library -B consumer-build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/gpe-install"
          cmake --build consumer-build --parallel 2
          cd consumer-build
          ./simulation
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen and zlib
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test installed library consumer
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/gpe-install"
          cmake -S examples/library -B consumer-build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/gpe-install"
          cmake --build consumer-build --parallel 2
          cd consumer-build
          ./simulation
